<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>어르신 한 손 건강 밥상 - 오늘의 영양 체크 폼</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX Parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const questions = [
        {
          id: 'carbs',
          title: '1. 오늘 밥(탄수화물)은 얼마나 드셨나요?',
          subtitle: '💡 기준: 매 끼니 주먹 크기 밥 1공기',
          icon: '🍚',
          options: [
            { id: 'c1', text: '① 밥 3공기 (삼시 세끼 든든하게)', subtext: '아주 훌륭해요! 기력 유지의 바탕입니다.', calories: 900, label: '밥 3공기 (900 kcal)' },
            { id: 'c2', text: '② 1~2공기 먹었거나 양이 부족했다', subtext: '조금 아쉬워요. 다음 끼니는 더 챙겨보세요.', calories: 450, label: '밥 1.5공기 (450 kcal)' },
            { id: 'c3', text: '③ 밥은 거의 안 먹고 다른 걸로 때웠다', subtext: '빵이나 면 대신 든든한 밥이 기력에 좋아요.', calories: 300, label: '대체식/소량 (300 kcal)' }
          ]
        },
        {
          id: 'protein',
          title: '2. 오늘 고기·생선·두부·계란(단백질)은 드셨나요?',
          subtitle: '💡 기준: 매 끼니 손바닥 크기 (손가락 제외)',
          icon: '🥩',
          options: [
            { id: 'p1', text: '① 매 끼니 손바닥 크기만큼 먹었다', subtext: '하루 3번! 근육과 다리 힘을 지키는 최고 습관입니다.', calories: 350, label: '매끼 섭취 (350 kcal)' },
            { id: 'p2', text: '② 하루 동안 손바닥 크기만큼 먹었다', subtext: '하루 1번 드셨네요. 매 끼니 조금씩 더 보충해 보세요.', calories: 120, label: '하루 1회 (120 kcal)' },
            { id: 'p3', text: '③ 거의 못 먹었다', subtext: '단백질이 많이 부족해요. 계란이나 두부를 꼭 드세요!', calories: 0, label: '미섭취 (0 kcal)' }
          ]
        },
        {
          id: 'veggies',
          title: '3. 오늘 나물이나 채소 반찬은 얼마나 드셨나요?',
          subtitle: '💡 기준: 매 끼니 양손 가득 모은 채소/나물',
          icon: '🥗',
          options: [
            { id: 'v1', text: '① 매 끼니 양손 가득 챙겨 먹었다', subtext: '장 건강과 변비 예방, 비타민 섭취에 완벽합니다.', calories: 80, label: '매끼 양손 가득 (80 kcal)' },
            { id: 'v2', text: '② 하루에 한두 번 대충 먹었다', subtext: '식이섬유가 다소 부족합니다. 나물 한 젓가락 더 드세요.', calories: 35, label: '하루 1~2회 (35 kcal)' },
            { id: 'v3', text: '③ 거의 먹지 않았다', subtext: '소화나 배변에 무리가 올 수 있어요. 채소를 가까이 하세요.', calories: 0, label: '미섭취 (0 kcal)' }
          ]
        },
        {
          id: 'fruits',
          title: '4. 오늘 과일은 얼마나 드셨나요?',
          subtitle: '💡 기준: 하루 주먹 하나 크기 제철 과일',
          icon: '🍎',
          options: [
            { id: 'f1', text: '① 주먹 크기만큼 알맞게 먹었다', subtext: '피로를 풀어주고 면역력을 높여줍니다.', calories: 75, label: '주먹 크기 (75 kcal)' },
            { id: 'f2', text: '② 주먹 크기보다 조금 먹었다', subtext: '조금 드셨군요. 제철 과일을 몇 조각 더 드셔보세요.', calories: 30, label: '소량 섭취 (30 kcal)' },
            { id: 'f3', text: '③ 먹지 않았다', subtext: '오늘 비타민 보충이 아쉽습니다. 귤이나 사과 하나 챙겨드세요.', calories: 0, label: '미섭취 (0 kcal)' }
          ]
        },
        {
          id: 'fats',
          title: '5. 참기름·들기름이나 견과류를 곁들이셨나요?',
          subtitle: '💡 기준: 매 끼니 엄지 마디 하나 / 견과류 한 꼬집',
          icon: '💧',
          options: [
            { id: 'ft1', text: '① 매 끼니 챙겨 먹었다', subtext: '뇌 건강과 혈관 건강에 좋은 식물성 기름입니다.', calories: 100, label: '매끼 섭취 (100 kcal)' },
            { id: 'ft2', text: '② 하루에 한 번 먹었다', subtext: '적당합니다. 나물에 들기름 한 방울을 곁들여보세요.', calories: 50, label: '하루 1회 (50 kcal)' },
            { id: 'ft3', text: '③ 거의 안 먹었다', subtext: '혈관 탄력과 피부 건조 예방을 위해 들기름이나 땅콩 등을 드세요.', calories: 0, label: '미섭취 (0 kcal)' }
          ]
        }
      ];

      const [answers, setAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);

      const handleSelect = (questionId, option) => {
        setAnswers((prev) => ({
          ...prev,
          [questionId]: option
        }));
      };

      const calculateTotalCalories = () => {
        return Object.values(answers).reduce((sum, item) => sum + (item?.calories || 0), 0);
      };

      const totalCalories = calculateTotalCalories();
      const allAnswered = Object.keys(answers).length === questions.length;
      const targetKcal = 1650;
      const percentage = Math.min(Math.round((totalCalories / targetKcal) * 100), 100);

      const handleReset = () => {
        setAnswers({});
        setIsSubmitted(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const getOverallFeedback = () => {
        if (totalCalories >= 1400) {
          return {
            grade: '🥇 참 잘하셨습니다! 최고의 영양 밥상',
            bg: 'bg-emerald-50 border-emerald-300 text-emerald-900',
            message: '오늘 하루 든든하고 균형 있게 식사하셨습니다. 근육 지킴과 기력 유지에 아주 훌륭한 식습관입니다. 내일도 오늘처럼 건강하게 드셔주세요!'
          };
        } else if (totalCalories >= 900) {
          return {
            grade: '🥈 양호합니다! 조금만 더 힘내세요',
            bg: 'bg-blue-50 border-blue-300 text-blue-900',
            message: '식사는 잘하셨지만 에너지가 약간 부족할 수 있어요. 계란, 두부 같은 단백질 반찬이나 따뜻한 국물, 제철 과일을 간식으로 챙겨 드셔보세요.'
          };
        } else {
          return {
            grade: '🥉 영양 보충이 꼭 필요해요!',
            bg: 'bg-orange-50 border-orange-300 text-orange-900',
            message: '오늘 드신 양이 너무 적거나 밥만 드셨을 수 있어요. 기운이 빠지고 근육이 줄어들 수 있으니, 다음 식사 때는 고기, 계란, 채소 반찬을 꼭 챙겨 드시기 바랍니다!'
          };
        }
      };

      return (
        <div class="min-h-screen bg-amber-50/40 font-sans text-gray-800 pb-16">
          <header class="bg-gradient-to-r from-teal-700 to-emerald-700 text-white shadow-lg sticky top-0 z-50">
            <div class="max-w-md mx-auto px-4 py-4 text-center">
              <div class="inline-flex items-center gap-2 bg-teal-800/60 px-3 py-1 rounded-full text-amber-200 text-xs font-semibold mb-1">
                ✨ 어르신 한 손 건강 밥상 리빙랩
              </div>
              <h1 class="text-2xl font-bold tracking-tight">오늘의 영양 체크 폼</h1>
              <p class="text-xs text-teal-100 mt-1">터치 몇 번으로 오늘 나의 건강 점수를 확인하세요!</p>
            </div>
          </header>

          <main class="max-w-md mx-auto px-4 pt-6">
            {!isSubmitted ? (
              <div class="space-y-6">
                <div class="bg-white p-4 rounded-2xl border-2 border-teal-200 shadow-sm flex items-start gap-3">
                  <div class="p-2.5 bg-teal-100 rounded-xl text-teal-800 flex-shrink-0 text-2xl">
                    😊
                  </div>
                  <div class="text-sm">
                    <h2 class="font-bold text-teal-900 text-base">어르신, 반갑습니다! 👋</h2>
                    <p class="text-gray-600 mt-0.5 leading-snug">
                      오늘 식사를 돌아보며 해당되는 글자를 <strong>손가락으로 꾹 눌러주세요.</strong>
                    </p>
                  </div>
                </div>

                {questions.map((q, idx) => {
                  const selectedOption = answers[q.id];
                  return (
                    <section key={q.id} class="bg-white p-5 rounded-3xl border-2 border-gray-100 shadow-md transition-all">
                      <div class="flex items-center gap-3 mb-2">
                        <div class="p-2 rounded-2xl bg-teal-50 border border-teal-100 text-2xl">
                          {q.icon}
                        </div>
                        <div>
                          <span class="text-xs font-bold text-teal-700 uppercase tracking-wider">질문 {idx + 1} / {questions.length}</span>
                          <h3 class="text-lg font-bold text-gray-900 leading-snug">{q.title}</h3>
                        </div>
                      </div>
                      
                      <p class="text-xs text-teal-800 font-medium bg-teal-50/80 px-3 py-1.5 rounded-lg mb-4 inline-block">
                        {q.subtitle}
                      </p>

                      <div class="space-y-3">
                        {q.options.map((opt) => {
                          const isSelected = selectedOption?.id === opt.id;
                          return (
                            <button
                              key={opt.id}
                              type="button"
                              onClick={() => handleSelect(q.id, opt)}
                              class={`w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-3 text-base font-medium select-none active:scale-[0.98] ${
                                isSelected
                                  ? 'bg-teal-700 text-white border-teal-700 shadow-md ring-2 ring-teal-300'
                                  : 'bg-gray-50/80 hover:bg-teal-50/50 border-gray-200 text-gray-800'
                              }`}
                            >
                              <div class={`mt-0.5 w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${
                                isSelected ? 'border-white bg-white text-teal-700 font-bold' : 'border-gray-300 bg-white'
                              }`}>
                                {isSelected ? '✓' : ''}
                              </div>
                              <div class="flex-1">
                                <div class="font-bold leading-snug">{opt.text}</div>
                                <div class={`text-xs mt-1 ${isSelected ? 'text-teal-100' : 'text-gray-500'}`}>
                                  {opt.subtext}
                                </div>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </section>
                  );
                })}

                <div class="pt-2 sticky bottom-4 z-40">
                  <button
                    type="button"
                    disabled={!allAnswered}
                    onClick={() => {
                      if (allAnswered) {
                        setIsSubmitted(true);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                      }
                    }}
                    class={`w-full py-4 px-6 rounded-2xl font-bold text-xl shadow-xl flex items-center justify-center gap-3 transition-all active:scale-95 ${
                      allAnswered
                        ? 'bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-orange-200 hover:brightness-105 cursor-pointer'
                        : 'bg-gray-300 text-gray-500 cursor-not-allowed shadow-none'
                    }`}
                  >
                    <span>{allAnswered ? '오늘 영양 확인하기 (결과 보기) ➔' : `${questions.length - Object.keys(answers).length}개 질문이 남아있습니다`}</span>
                  </button>
                </div>
              </div>
            ) : (
              <div class="space-y-6 animate-fadeIn">
                {(() => {
                  const fb = getOverallFeedback();
                  return (
                    <div class={`p-6 rounded-3xl border-2 shadow-lg ${fb.bg} text-center relative overflow-hidden`}>
                      <div class="inline-block p-3 bg-white rounded-full shadow-sm mb-3 text-3xl">
                        👵🏼👨🏼‍🦳
                      </div>
                      <h2 class="text-2xl font-extrabold mb-2">{fb.grade}</h2>
                      <p class="text-base font-medium leading-relaxed px-2 text-gray-800">{fb.message}</p>
                    </div>
                  );
                })()}

                <div class="bg-white p-6 rounded-3xl border-2 border-gray-100 shadow-md">
                  <h3 class="text-lg font-bold text-gray-900 flex items-center justify-between mb-4">
                    <span>오늘의 예상 섭취 칼로리</span>
                    <span class="text-xs text-gray-500 font-normal">어르신 권장: 1,500~1,800 kcal</span>
                  </h3>

                  <div class="text-center py-3 bg-amber-50 rounded-2xl border border-amber-100 mb-5">
                    <span class="text-4xl font-extrabold text-amber-600">{totalCalories}</span>
                    <span class="text-xl font-bold text-gray-600 ml-1.5">kcal</span>
                    <p class="text-xs text-amber-800 mt-1 font-medium">
                      하루 목표 대사량의 약 <strong>{percentage}%</strong>를 채우셨습니다.
                    </p>
                  </div>

                  <div class="space-y-1.5 mb-2">
                    <div class="flex justify-between text-xs text-gray-500 font-semibold">
                      <span>0 kcal</span>
                      <span>권장 1,650 kcal</span>
                    </div>
                    <div class="w-full h-5 bg-gray-100 rounded-full overflow-hidden p-1 border border-gray-200">
                      <div 
                        class={`h-full rounded-full transition-all duration-1000 ${
                          totalCalories >= 1400 ? 'bg-emerald-500' : totalCalories >= 900 ? 'bg-amber-500' : 'bg-red-500'
                        }`}
                        style={{ width: `${percentage}%` }}
                      ></div>
                    </div>
                  </div>
                </div>

                <div class="bg-white p-5 rounded-3xl border-2 border-gray-100 shadow-md">
                  <h3 class="text-base font-bold text-gray-900 mb-3 flex items-center gap-2">
                    ℹ️ <span>내가 선택한 식사 요약</span>
                  </h3>
                  
                  <div class="divide-y divide-gray-100 text-sm">
                    {questions.map((q) => {
                      const sel = answers[q.id];
                      return (
                        <div key={q.id} class="py-3 flex justify-between items-center gap-2">
                          <span class="font-semibold text-gray-700">{q.title.split('.')[1].split('(')[0]}</span>
                          <span class="font-bold text-teal-800 bg-teal-50 px-3 py-1 rounded-full text-xs">
                            {sel?.label || '미선택'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div class="bg-teal-800 text-white p-5 rounded-3xl shadow-md">
                  <h4 class="font-bold text-lg mb-2 flex items-center gap-2">
                    🤝 <span>어르신을 위한 건강 꿀팁</span>
                  </h4>
                  <ul class="text-xs text-teal-100 space-y-2 list-disc pl-4 leading-relaxed">
                    <li><strong>밥만 드시지 마세요:</strong> 단백질(두부, 생선, 계란)을 매 끼니 손바닥만큼 챙겨야 무릎과 다리 근육이 유지됩니다.</li>
                    <li><strong>물은 종이컵 6~8컵:</strong> 목이 마르지 않아도 수시로 물을 마셔 정맥 및 혈액순환을 도와주세요.</li>
                    <li><strong>싱겁게 나물 드시기:</strong> 소금간은 줄이고 들기름이나 참기름을 살짝 쳐서 드시면 뇌 건강에 좋습니다.</li>
                  </ul>
                </div>

                <div class="pt-2 space-y-3">
                  <button
                    type="button"
                    onClick={handleReset}
                    class="w-full py-4 bg-white border-2 border-teal-700 text-teal-800 rounded-2xl font-bold text-lg shadow-md flex items-center justify-center gap-2 active:scale-95 transition-all cursor-pointer"
                  >
                    🔄 <span>다시 입력하기</span>
                  </button>
                </div>
              </div>
            )}
          </main>

          <footer class="max-w-md mx-auto mt-8 text-center text-xs text-gray-400 px-4">
            <p>노인복지관 & 간호학생 리빙랩 영양 지원 프로젝트</p>
            <p class="mt-0.5">본 설문 도구는 어르신의 자가 식습관 관리를 돕기 위해 제작되었습니다.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
